id: it.belloworld.mercurygram
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: Mercurygram
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --system-talk-name=org.bluez
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=org.sigxcpu.Feedback
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  cflags: -g1
  cxxflags: -g1
  env:
    CCACHE_COMPILERCHECK: '%compiler% -v'
    CMAKE_BUILD_TYPE: None
    CMAKE_PREFIX_PATH: /app
    CARGO_NET_OFFLINE: 'true'
    CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
    CARGO_PROFILE_RELEASE_LTO: off
    CARGO_PROFILE_RELEASE_PANIC: unwind
modules:
  - name: pkg-config
    buildsystem: simple
    build-commands:
      - install -d $FLATPAK_DEST/bin
      - |
        cat <<EOF > $FLATPAK_DEST/bin/pkg-config
        #!/bin/sh
        unset PKG_CONFIG_ALLOW_SYSTEM_LIBS
        exec /usr/bin/pkg-config "\$@"
        EOF
      - chmod +x $FLATPAK_DEST/bin/pkg-config
    cleanup:
      - '*'

  - name: jinja2
    buildsystem: simple
    build-commands:
      - pip3 install --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        flit-core --no-build-isolation
      - pip3 install --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        "Jinja2" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/d3/8b/0370578a456986d6995344967a479dd5c9d4e064681550c2a9594bb58b4a/flit_core-4.2.0.tar.gz
        sha256: 84e4e4d8fdd45ba2613800a3ebc6834de26d47ec9746efc3719f94181137b460
        x-checker-data:
          type: pypi
          name: flit-core
      - type: file
        url: https://files.pythonhosted.org/packages/38/9b/e422a865e1d5d57d0e509b4e0bf1c1a70a7f6382c29a5aa428df994c8bc8/markupsafe-3.0.4.tar.gz
        sha256: 2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6
        x-checker-data:
          type: pypi
          name: MarkupSafe
      - type: file
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d
        x-checker-data:
          type: pypi
          name: Jinja2
    cleanup:
      - '*'

  - name: systemd
    buildsystem: meson
    builddir: true
    config-opts:
      - --buildtype=plain
    make-args:
      - systemd-detect-virt
    no-make-install: true
    post-install:
      - install -Dt "$FLATPAK_DEST/bin" systemd-detect-virt
    sources:
      - type: git
        url: https://github.com/systemd/systemd.git
        commit: 73612ea502d53baf9b0df4336cfc296a7ee0d524
        tag: v262.1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/systemd/systemd/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
      - type: shell
        commands:
          - >-
            sed -i "s/'link_with' : libshared/'link_with' : [libshared_static, libsystemd_static,
            libbasic_static]/" meson.build

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=regex
      - ./b2 release link=static cflags="$CFLAGS" cxxflags="$CXXFLAGS" linkflags="$LDFLAGS"
        -j$FLATPAK_BUILDER_N_JOBS install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
        sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_${patch}.tar.bz2
    cleanup:
      - '*'

  - name: ada
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DADA_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/ada-url/ada.git
        commit: b12a893a45809da8103bb4f1e2f6f5ee13f9100b
        tag: v4.0.0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ada-url/ada/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        commit: 2c74169b34066ceb8ddb6b882fcb3fb32d737a55
        tag: v36.2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protocolbuffers/protobuf/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: openh264
    buildsystem: meson
    config-opts:
      - --buildtype=plain
      - --default-library=static
      - -Dtests=disabled
    sources:
      - type: git
        url: https://github.com/cisco/openh264.git
        commit: 1bca62311e447fd9c39fc93de2c4b96cd5ce971c
        tag: v2.7.0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/cisco/openh264/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: minizip
    subdir: contrib/minizip
    config-opts:
      - --disable-shared
    sources:
      - type: git
        url: https://github.com/madler/zlib.git
        commit: e3dc0a85b7032e98380dec011bc8f2c2ee0d8fca
        x-checker-data:
          type: git
          tag-pattern: ^v([\\d.]+)$
          versions:
            '>': 1.3.2
      - type: shell
        commands:
          - cd contrib/minizip && autoreconf -fi
    cleanup:
      - '*'

  - name: rnnoise
    config-opts:
      - --disable-shared
      - --disable-examples
      - --disable-doc
    sources:
      - type: archive
        url: https://github.com/xiph/rnnoise/releases/download/v0.2/rnnoise-0.2.tar.gz
        sha256: 90fce4b00b9ff24c08dbfe31b82ffd43bae383d85c5535676d28b0a2b11c0d37
        x-checker-data:
          type: json
          url: https://api.github.com/repos/xiph/rnnoise/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
          url-query: '"https://github.com/xiph/rnnoise/releases/download/\($tag)/rnnoise-\($version).tar.gz"'
      # https://github.com/xiph/rnnoise/commit/372f7b4b76cde4ca1ec4605353dd17898a99de38
      - type: patch
        path: rnnoise-build-fix.patch
    cleanup:
      - '*'

  - name: tg_owt
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: git
        url: https://github.com/desktop-app/tg_owt.git
        commit: 07fb35bc33b3e79125a1beab7690e830f183f5d8
        x-checker-data:
          type: json
          parent-id: tdesktop-git-0
          commit-data-url: >-
            "https://github.com/Mercurygram/mdesktop/raw/\($parent.new.tag//$parent.current.tag)/snap/snapcraft.yaml"
          commit-query: >-
            .parts.webrtc."source-commit"
          version-data-url: >-
            "https://api.github.com/repos/desktop-app/tg_owt/commits/\($commit)"
          version-query: >-
            "desktop-app/tg_owt@\(.sha[0:7])"
          timestamp-data-url: >-
            "https://api.github.com/repos/desktop-app/tg_owt/commits/\($commit)"
          timestamp-query: >-
            .commit.committer.date
    cleanup:
      - '*'

  - name: tde2e
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DTD_E2E_ONLY=ON
    sources:
      - type: git
        url: https://github.com/tdlib/td.git
        commit: 51743dfd01dff6179e2d8f7095729caa4e2222e9
        x-checker-data:
          type: json
          parent-id: tdesktop-git-0
          commit-data-url: >-
            "https://github.com/Mercurygram/mdesktop/raw/\($parent.new.tag//$parent.current.tag)/snap/snapcraft.yaml"
          commit-query: >-
            .parts.tde2e."source-commit"
          version-data-url: >-
            "https://api.github.com/repos/tdlib/td/commits/\($commit)"
          version-query: >-
            "tdlib/td@\(.sha[0:7])"
          timestamp-data-url: >-
            "https://api.github.com/repos/tdlib/td/commits/\($commit)"
          timestamp-query: >-
            .commit.committer.date
    cleanup:
      - '*'

  - name: tdesktop_rust
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/tdesktop_rust/cargo
    build-commands:
      - |
        set -euo pipefail
        cargo new --lib --vcs none tdesktop_rust
        cd tdesktop_rust
        printf 'pub use ::tlottie;\npub use ::wallet_engine;\n' > src/lib.rs
        cargo add --path ../tlottie --features c-api
        cargo add --path ../wallet-engine
        cargo rustc --lib --release \
          --crate-type staticlib --crate-type cdylib \
          -- --print native-static-libs
        mkdir -p $FLATPAK_DEST/lib $FLATPAK_DEST/include/tlottie $FLATPAK_DEST/include/wallet_engine
        objcopy --strip-debug target/release/libtdesktop_rust.a $FLATPAK_DEST/lib/libtdesktop_rust.a
        cp ../tlottie/include/tlottie.h $FLATPAK_DEST/include/tlottie/tlottie.h
        cargo run --locked --manifest-path ../wallet-engine/bindgen/cpp/bindgen/Cargo.toml -- \
          --library --out-dir $FLATPAK_DEST/include/wallet_engine \
          target/release/libtdesktop_rust.so
    sources:
      # The three commits come from mdesktop's snap/snapcraft.yaml (tlottie,
      # wallet-engine and patches parts) at the tdesktop tag below.
      # x-checker-data can follow them the same way as tg_owt and tde2e once
      # Flathub grants the module-tdesktop_rust-checker-tracks-commits lint
      # exception; until then bump them by hand together with tdesktop.
      - type: git
        dest: tlottie
        url: https://github.com/dkaraush/tlottie.git
        commit: 92df98dc209bc39b1e567ec74a8c86a0af5239de
        x-cargo-lock:
          - Cargo.lock
      - type: git
        dest: wallet-engine
        url: https://github.com/i582/wallet-engine.git
        commit: e59e0d89d7ee90c388bf36e3334c5b276f396697
        x-cargo-lock:
          - Cargo.lock
          - bindgen/cpp/Cargo.lock
      - type: git
        url: https://github.com/desktop-app/patches.git
        commit: aec474953ff7ee9b6e4cd9b8658288ea86d124f3
        dest: patches
      - type: shell
        commands:
          - git -C wallet-engine apply $PWD/patches/wallet-engine.patch
      # .github/workflows/rust-updater.yml regenerates this file on bot PRs
      # from the Cargo.lock files listed in x-cargo-lock above.
      - tdesktop_rust.yml
    cleanup:
      - '*'

  - name: tdesktop
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cflags: -fpch-preprocess
      cxxflags: -fpch-preprocess
      env:
        CCACHE_SLOPPINESS: pch_defines,time_macros
    config-opts:
      - -DTDESKTOP_API_ID=575730
      - -DTDESKTOP_API_HASH=723c7927097f8487d229438af766e329
      - -DDESKTOP_APP_USE_PACKAGED=ON
      - -DDESKTOP_APP_USE_QTWEBENGINE=ON
    post-install:
      - ccache --evict-older-than 1d
    sources:
      - type: git
        url: https://github.com/Mercurygram/mdesktop.git
        commit: 2a8f355a6ac542a8395636e37a2be037da849c2b
        tag: v7.3.3.2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Mercurygram/mdesktop/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
      # release.yml patches the 4-part version at build time, but this manifest
      # builds the raw tagged tree; without this the AppStream/Flatpak version
      # drops the fork counter (X.Y.Z.N -> X.Y.Z). Derive the tag from the
      # checkout so the version bumps automatically with the git source above.
      - type: shell
        commands:
          - python3 Telegram/build/set_release_version.py "$(git describe --tags --exact-match)"
    cleanup:
      - /share/icons/hicolor/512x512@2
